name: Build BakaSU Kernel with SuSFS (bramble LOS24)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'LineageOS Kernel Branch (z.B. lineage-24.0 oder lineage-23.2)'
        required: true
        default: 'lineage-24.0'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Free up disk space & install dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

          # DNS- und Mirror-Fix
          echo -e "nameserver 1.1.1.1\nnameserver 8.8.8.8" | sudo tee /etc/resolv.conf > /dev/null
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list 2>/dev/null || true

          for i in 1 2 3; do sudo apt-get update && break || sleep 5; done
          sudo apt-get install -y --fix-missing bc bison flex libssl-dev make zip unzip python3 cpio libelf-dev dwarves git curl lz4 patch gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone LineageOS redbull kernel, Toolchain & SuSFS
        run: |
          mkdir -p work && cd work
          git clone --depth=1 -b ${{ github.event.inputs.branch }} https://github.com/LineageOS/android_kernel_google_redbull.git kernel
          git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r487747c.git clang
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          git clone --depth=1 -b kernel-4.19 https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu

      - name: Apply SuSFS 4.19 Patches & Integrate BakaSU
        run: |
          cd work/kernel

          # 1. SuSFS-Dateien kopieren
          cp -r ../susfs4ksu/kernel_patches/fs/* fs/
          cp -r ../susfs4ksu/kernel_patches/include/linux/* include/linux/

          # 2. SuSFS 4.19 Basis-Patch anwenden
          patch -p1 --forward < ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch || true

          # 3. Sicherstellen, dass fs/susfs.o IMMER gebaut wird (behebt alle susfs_* Linkerfehler)
          sed -i '/susfs.o/d' fs/Makefile
          echo "obj-y += susfs.o" >> fs/Makefile
          sed -i '1i #ifndef CONFIG_KSU_SUSFS\n#define CONFIG_KSU_SUSFS 1\n#endif\n#ifndef CONFIG_SUSFS\n#define CONFIG_SUSFS 1\n#endif' fs/susfs.c 2>/dev/null || true

          # 4. BakaSU integrieren
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -

          # 5. 4.19-Header Fixes
          [ -f drivers/kernelsu/Makefile ] && sed -i 's/static_call.h/static_call_disabled_for_4_19.h/g' drivers/kernelsu/Makefile
          [ -f drivers/kernelsu/kernel_includes.h ] && sed -i 's|#include <linux/static_call.h>|/* disabled on 4.19 */|g' drivers/kernelsu/kernel_includes.h
          [ -f drivers/kernelsu/extension/cpu_spoof.c ] && sed -i 's/->vdso_clock_mode/->rating/g' drivers/kernelsu/extension/cpu_spoof.c

          # 6. Python-Patcher: Hooks setzen und dispatch.c anpassen
          python3 - << 'PYEOF'
          import re, os, subprocess

          # --- A. include/linux/susfs.h ergänzen ---
          susfs_h = "include/linux/susfs.h"
          if os.path.exists(susfs_h):
              with open(susfs_h, "r") as f:
                  sh = f.read()
              extra_susfs = (
                  "\n#ifndef SUSFS_MAGIC\n#define SUSFS_MAGIC 0x55534653\n#endif\n"
                  "#ifndef DEFAULT_SUS_MNT_ID\n#define DEFAULT_SUS_MNT_ID 100000\n#endif\n"
                  "#ifndef DEFAULT_SUS_MNT_GROUP_ID\n#define DEFAULT_SUS_MNT_GROUP_ID 1000\n#endif\n"
                  "#ifndef DEFAULT_SUS_MNT_ID_FOR_KSU_PROC_UNSHARE\n#define DEFAULT_SUS_MNT_ID_FOR_KSU_PROC_UNSHARE 1000000\n#endif\n"
                  "#ifndef CL_COPY_MNT_NS\n#define CL_COPY_MNT_NS 0x20\n#endif\n"
                  "#ifndef CL_ZYGOTE_COPY_MNT_NS\n#define CL_ZYGOTE_COPY_MNT_NS 0x40\n#endif\n"
                  "#ifndef CMD_SUSFS_ADD_SUS_PATH_LOOP\n#define CMD_SUSFS_ADD_SUS_PATH_LOOP 0x55568\n#endif\n"
                  "#ifndef CMD_SUSFS_HIDE_SUS_MNTS_FOR_NON_SU_PROCS\n#define CMD_SUSFS_HIDE_SUS_MNTS_FOR_NON_SU_PROCS 0x5556c\n#endif\n"
                  "#ifndef CMD_SUSFS_ADD_SUS_MAP\n#define CMD_SUSFS_ADD_SUS_MAP 0x55566\n#endif\n"
                  "#ifndef CMD_SUSFS_ENABLE_AVC_LOG_SPOOFING\n#define CMD_SUSFS_ENABLE_AVC_LOG_SPOOFING 0x5556a\n#endif\n"
                  "struct kstat;\n"
                  "struct st_susfs_sus_path_loop;\n"
                  "struct st_susfs_sus_map;\n"
                  "#define susfs_add_sus_path_loop(...) (0)\n"
                  "#define susfs_hide_sus_mnts_for_non_su_procs(...) (0)\n"
                  "#define susfs_add_sus_map(...) (0)\n"
                  "#define susfs_enable_avc_log_spoofing(...) (0)\n"
              )
              if "CMD_SUSFS_ADD_SUS_PATH_LOOP" not in sh:
                  with open(susfs_h, "w") as f:
                      f.write(extra_susfs + sh)
                  print("[OK] include/linux/susfs.h ergänzt")

          # --- B. dispatch.c Stubs & Dereferenzierung ---
          for root, dirs, files in os.walk("."):
              if "dispatch.c" in files:
                  fp = os.path.join(root, "dispatch.c")
                  with open(fp, "r") as f:
                      txt = f.read()
                  if "BTI_DISP_STUBS" not in txt:
                      disp_stub = (
                          "#ifndef BTI_DISP_STUBS\n#define BTI_DISP_STUBS 1\n"
                          "#include <linux/susfs.h>\n"
                          "#ifndef CMD_SUSFS_ADD_SUS_PATH_LOOP\n#define CMD_SUSFS_ADD_SUS_PATH_LOOP 0x55568\n#endif\n"
                          "#ifndef CMD_SUSFS_HIDE_SUS_MNTS_FOR_NON_SU_PROCS\n#define CMD_SUSFS_HIDE_SUS_MNTS_FOR_NON_SU_PROCS 0x5556c\n#endif\n"
                          "#ifndef CMD_SUSFS_ADD_SUS_MAP\n#define CMD_SUSFS_ADD_SUS_MAP 0x55566\n#endif\n"
                          "#ifndef CMD_SUSFS_ENABLE_AVC_LOG_SPOOFING\n#define CMD_SUSFS_ENABLE_AVC_LOG_SPOOFING 0x5556a\n#endif\n"
                          "struct st_susfs_sus_path_loop;\n"
                          "struct st_susfs_sus_map;\n"
                          "#define susfs_add_sus_path_loop(...) (0)\n"
                          "#define susfs_hide_sus_mnts_for_non_su_procs(...) (0)\n"
                          "#define susfs_add_sus_map(...) (0)\n"
                          "#define susfs_enable_avc_log_spoofing(...) (0)\n"
                          "#endif\n"
                      )
                      txt = disp_stub + txt
                  txt = re.sub(r'(susfs_[a-z0-9_]+)\(\s*arg\s*\)', r'\1((void *)*arg)', txt)
                  with open(fp, "w") as f:
                      f.write(txt)
                  print(f"[OK] {fp} gepatcht (Zeiger-Dereferenzierung)")

          # --- C. supercall.c mit SUSFS_MAGIC versorgen ---
          for root, dirs, files in os.walk("."):
              if "supercall.c" in files:
                  fp = os.path.join(root, "supercall.c")
                  with open(fp, "r") as f:
                      txt = f.read()
                  if "SUSFS_MAGIC" not in txt or "#define SUSFS_MAGIC" not in txt:
                      txt = "#ifndef SUSFS_MAGIC\n#define SUSFS_MAGIC 0x55534653\n#endif\n" + txt
                      with open(fp, "w") as f:
                          f.write(txt)
                      print(f"[OK] {fp} gepatcht")

          # --- D. include/linux/mount.h: susfs_mnt_id_backup ---
          with open("include/linux/mount.h", "r") as f:
              mh = f.read()
          if "susfs_mnt_id_backup" not in mh:
              mh = re.sub(r'(int\s+mnt_flags;)',
                          r'\1\n#ifdef CONFIG_KSU_SUSFS\n\tu64 susfs_mnt_id_backup;\n#endif', mh, count=1)
              with open("include/linux/mount.h", "w") as f:
                  f.write(mh)
              print("[OK] include/linux/mount.h gepatcht")

          # --- E. fs/pnode.h: CL_COPY_MNT_NS Konstanten ---
          with open("fs/pnode.h", "r") as f:
              pnh = f.read()
          if "CL_COPY_MNT_NS" not in pnh:
              pnh += "\n#ifndef CL_COPY_MNT_NS\n#define CL_COPY_MNT_NS 0x20\n#endif\n#ifndef CL_ZYGOTE_COPY_MNT_NS\n#define CL_ZYGOTE_COPY_MNT_NS 0x40\n#endif\n"
              with open("fs/pnode.h", "w") as f:
                  f.write(pnh)
              print("[OK] fs/pnode.h gepatcht")

          # --- F. fs/namespace.c Rejects auflösen ---
          with open("fs/namespace.c", "r") as f:
              ns = f.read()

          hunk1 = (
              "\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
              "#include <linux/susfs.h>\n"
              "extern bool susfs_is_current_zygote_domain(void);\n"
              "extern struct ida susfs_mnt_id_ida;\n"
              "extern struct ida susfs_mnt_group_ida;\n"
              "#ifndef DEFAULT_SUS_MNT_ID\n#define DEFAULT_SUS_MNT_ID 100000\n#endif\n"
              "#ifndef DEFAULT_SUS_MNT_GROUP_ID\n#define DEFAULT_SUS_MNT_GROUP_ID 1000\n#endif\n"
              "#ifndef DEFAULT_SUS_MNT_ID_FOR_KSU_PROC_UNSHARE\n#define DEFAULT_SUS_MNT_ID_FOR_KSU_PROC_UNSHARE 1000000\n#endif\n"
              "#ifndef CL_COPY_MNT_NS\n#define CL_COPY_MNT_NS 0x20\n#endif\n"
              "#ifndef CL_ZYGOTE_COPY_MNT_NS\n#define CL_ZYGOTE_COPY_MNT_NS 0x40\n#endif\n"
              "#endif\n"
          )
          if "extern struct ida susfs_mnt_id_ida;" not in ns:
              ns = hunk1 + ns

          ns = re.sub(
              r'alloc_vfsmnt\((fc->source \?: "none"|name)\)',
              r'alloc_vfsmnt(\1, false, 0)',
              ns
          )

          ns = re.sub(
              r'alloc_vfsmnt\(old->mnt_devname\)',
              r'alloc_vfsmnt(old->mnt_devname, (flag & CL_COPY_MNT_NS) ? true : false, (flag & CL_ZYGOTE_COPY_MNT_NS) ? DEFAULT_SUS_MNT_ID_FOR_KSU_PROC_UNSHARE : 0)',
              ns
          )

          if "mnt->mnt.susfs_mnt_id_backup = old->mnt.susfs_mnt_id_backup;" not in ns:
              ns = re.sub(
                  r'(mnt->mnt\.mnt_flags\s*=\s*old->mnt\.mnt_flags;)',
                  r'\1\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n\tmnt->mnt.susfs_mnt_id_backup = old->mnt.susfs_mnt_id_backup;\n#endif',
                  ns, count=1
              )

          with open("fs/namespace.c", "w") as f:
              f.write(ns)
          print("[OK] fs/namespace.c gepatcht")

          # --- G. Die 7 BakaSU Pflicht-Hooks ---
          # 1. drivers/input/input.c
          with open("drivers/input/input.c", "r") as f:
              inp = f.read()
          if "ksu_handle_input_handle_event" not in inp:
              inp = "#ifdef CONFIG_KSU\nextern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);\n#endif\n" + inp
              target_disp = "int disposition = input_get_disposition(dev, type, code, &value);"
              hook_disp = (
                  "\tint disposition;\n"
                  "#ifdef CONFIG_KSU\n"
                  "\tksu_handle_input_handle_event(&type, &code, &value);\n"
                  "#endif\n"
                  "\tdisposition = input_get_disposition(dev, type, code, &value);"
              )
              inp = inp.replace(target_disp, hook_disp, 1)
              with open("drivers/input/input.c", "w") as f:
                  f.write(inp)
              print("[OK] drivers/input/input.c gepatcht")

          # 2. kernel/sys.c -> ksu_handle_setresuid
          with open("kernel/sys.c", "r") as f:
              sc = f.read()
          if "ksu_handle_setresuid" not in sc:
              decl = "#ifdef CONFIG_KSU\nextern int ksu_handle_setresuid(uid_t ruid, uid_t euid, uid_t suid);\n#endif\n\n"
              sc = re.sub(r'(long __sys_setresuid\()', decl + r'\1', sc, count=1)
              sc = re.sub(r'(long __sys_setresuid\([^{]+\{[^\n]*\n(?:[ \t]+[^\n]*;[ \t]*\n)+)',
                          r'\1#ifdef CONFIG_KSU\n\tksu_handle_setresuid(ruid, euid, suid);\n#endif\n', sc, count=1)
              with open("kernel/sys.c", "w") as f:
                  f.write(sc)
              print("[OK] kernel/sys.c gepatcht")

          # 3. kernel/reboot.c -> ksu_handle_sys_reboot
          with open("kernel/reboot.c", "r") as f:
              rc = f.read()
          if "ksu_handle_sys_reboot" not in rc:
              decl = "#ifdef CONFIG_KSU\nextern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n#endif\n\n"
              rc = re.sub(r'(SYSCALL_DEFINE4\(reboot,)', decl + r'\1', rc, count=1)
              rc = re.sub(r'(SYSCALL_DEFINE4\(reboot,[^{]+\{[^\n]*\n(?:[ \t]+[^\n]*;[ \t]*\n)+)',
                          r'\1#ifdef CONFIG_KSU\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif\n', rc, count=1)
              with open("kernel/reboot.c", "w") as f:
                  f.write(rc)
              print("[OK] kernel/reboot.c gepatcht")

          # 4. fs/exec.c -> ksu_handle_execveat
          with open("fs/exec.c", "r") as f:
              ec = f.read()
          if "ksu_handle_execveat" not in ec:
              decl = "#ifdef CONFIG_KSU\nstruct filename;\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n#endif\n\n"
              ec = re.sub(r'(#include\s*[<"][^>"]+[>"])', r'\1\n' + decl, ec, count=1)
              hook = "#ifdef CONFIG_KSU\n\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n#endif\n\t"
              ec = re.sub(r'(if \(IS_ERR\(filename\)\))', hook + r'\1', ec, count=1)
              with open("fs/exec.c", "w") as f:
                  f.write(ec)
              print("[OK] fs/exec.c gepatcht")

          # 5. fs/open.c -> ksu_handle_faccessat
          with open("fs/open.c", "r") as f:
              oc = f.read()
          if "ksu_handle_faccessat" not in oc:
              decl = "#ifdef CONFIG_KSU\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n#endif\n\n"
              oc = re.sub(r'(long do_faccessat\()', decl + r'\1', oc, count=1)
              oc = re.sub(r'(long do_faccessat\([^{]+\{[^\n]*\n(?:[ \t]+[^\n]*;[ \t]*\n)+)',
                          r'\1#ifdef CONFIG_KSU\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif\n', oc, count=1)
              with open("fs/open.c", "w") as f:
                  f.write(oc)
              print("[OK] fs/open.c gepatcht")

          # 6. fs/stat.c -> NUR ksu_handle_stat (keine newfstat_ret/fstat64_ret Aufrufe)
          with open("fs/stat.c", "r") as f:
              stc = f.read()
          if "ksu_handle_stat" not in stc:
              decl = "#ifdef CONFIG_KSU\nstruct stat;\nstruct stat64;\nextern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n#endif\n\n"
              stc = re.sub(r'(int vfs_statx\()', decl + r'\1', stc, count=1)
              stc = re.sub(r'(int vfs_statx\([^{]+\{[^\n]*\n(?:[ \t]+[^\n]*;[ \t]*\n)+)',
                           r'\1#ifdef CONFIG_KSU\n\tksu_handle_stat(&dfd, &filename, &flags);\n#endif\n', stc, count=1)
              with open("fs/stat.c", "w") as f:
                  f.write(stc)
              print("[OK] fs/stat.c gepatcht")

          # 7. fs/read_write.c -> ksu_handle_sys_read
          with open("fs/read_write.c", "r") as f:
              rwc = f.read()
          if "ksu_handle_sys_read" not in rwc:
              decl = "#ifdef CONFIG_KSU\nextern int ksu_handle_sys_read(unsigned int fd, char __user **buf_ptr, size_t *count_ptr);\n#endif\n\n"
              rwc = re.sub(r'(SYSCALL_DEFINE3\(read,)', decl + r'\1', rwc, count=1)
              rwc = re.sub(r'(SYSCALL_DEFINE3\(read,[^{]+\{[^\n]*\n(?:[ \t]+[^\n]*;[ \t]*\n)+)',
                           r'\1#ifdef CONFIG_KSU\n\tksu_handle_sys_read(fd, &buf, &count);\n#endif\n', rwc, count=1)
              with open("fs/read_write.c", "w") as f:
                  f.write(rwc)
              print("[OK] fs/read_write.c gepatcht")
          PYEOF

          # Defconfig vorbereiten
          DEFCONFIG=$(find arch/arm64/configs -name "redbull_defconfig" | head -n 1)
          printf '%s\n' \
            "CONFIG_KSU=y" \
            "CONFIG_KSU_MANUAL_HOOK=y" \
            "CONFIG_KSU_MULTI_MANAGER_SUPPORT=y" \
            "CONFIG_KSU_SUSFS=y" \
            "CONFIG_SUSFS=y" \
            "CONFIG_KSU_SUSFS_SUS_PATH=y" \
            "CONFIG_KSU_SUSFS_SUS_MOUNT=y" \
            "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" \
            "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" \
            "CONFIG_KSU_SUSFS_SUS_KSTAT=y" \
            "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y" \
            "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" \
            "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" \
            "CONFIG_KSU_SUSFS_ENABLE_LOG=y" \
            "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" \
            "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" \
            "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" \
            "CONFIG_KALLSYMS=y" \
            "CONFIG_KALLSYMS_ALL=y" >> "$DEFCONFIG"

          git config user.email "builder@local"
          git config user.name "builder"
          git add -A
          git commit -m "Integrate BakaSU and SuSFS 4.19 cleanly" || true

      - name: Compile Kernel (Image.lz4)
        run: |
          set -o pipefail
          cd work/kernel
          export PATH="$GITHUB_WORKSPACE/work/clang/bin:$PATH"
          DEFCONFIG=$(find arch/arm64/configs -name "redbull_defconfig" | head -n 1)
          DEFCONFIG_REL=${DEFCONFIG#arch/arm64/configs/}

          make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            "$DEFCONFIG_REL"

          ./scripts/config --file out/.config \
            -e KSU \
            -e KSU_MANUAL_HOOK \
            -e KSU_MULTI_MANAGER_SUPPORT \
            -e KSU_SUSFS \
            -e SUSFS \
            -e KSU_SUSFS_SUS_PATH \
            -e KSU_SUSFS_SUS_MOUNT \
            -e KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            -e KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            -e KSU_SUSFS_SUS_KSTAT \
            -e KSU_SUSFS_SUS_OVERLAYFS \
            -e KSU_SUSFS_TRY_UMOUNT \
            -e KSU_SUSFS_SPOOF_UNAME \
            -e KSU_SUSFS_ENABLE_LOG \
            -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            -e KSU_SUSFS_OPEN_REDIRECT
          make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

          echo "=== Aktive SuSFS- & BakaSU-Konfiguration ==="
          grep -E "CONFIG_KSU_SUSFS|CONFIG_SUSFS|CONFIG_KSU_MANUAL_HOOK" out/.config || true

          if ! make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" DTC_FLAGS="-f" Image.lz4 2>&1 | tee build.log; then
            echo "=== FEHLER IM BUILD-LOG ==="
            grep -iE "error:|ERROR \(|undefined reference|fatal error|No rule to make" build.log | tail -n 30
            exit 1
          fi

      - name: Package AnyKernel3
        run: |
          cd work
          for img in Image.lz4-dtb Image.lz4 Image.gz-dtb Image.gz Image; do
            if [ -f "kernel/out/arch/arm64/boot/$img" ]; then
              cp "kernel/out/arch/arm64/boot/$img" AnyKernel3/
              break
            fi
          done

          cd AnyKernel3
          sed -i 's/device.name1=maguro/device.name1=bramble/' anykernel.sh
          sed -i 's/device.name2=toro/device.name2=redfin/' anykernel.sh
          sed -i 's|BLOCK=.*;|BLOCK=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=0;/IS_SLOT_DEVICE=1;/' anykernel.sh
          zip -r9 "$GITHUB_WORKSPACE/BakaSU-SuSFS-bramble.zip" * -x .git README.md *placeholder

      - name: Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BakaSU-SuSFS-bramble
          path: BakaSU-SuSFS-bramble.zip
