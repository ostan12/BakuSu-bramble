name: Build BakaSU Kernel (bramble LOS24)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'LineageOS Kernel Branch (z.B. lineage-24.0 oder lineage-23.2)'
        required: true
        default: 'lineage-24.0'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Free up disk space & install dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make zip unzip python3 cpio libelf-dev dwarves git curl lz4 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone LineageOS redbull kernel & Toolchain
        run: |
          mkdir -p work && cd work
          git clone --depth=1 -b ${{ github.event.inputs.branch }} https://github.com/LineageOS/android_kernel_google_redbull.git kernel
          git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r487747c.git clang
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git

      - name: Integrate BakaSU & Manual Hooks (Android 17 / 4.19)
        run: |
          cd work/kernel
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -

          # Absicherung für Kernel 4.19
          [ -f drivers/kernelsu/Makefile ] && sed -i 's/static_call.h/static_call_disabled_for_4_19.h/g' drivers/kernelsu/Makefile
          [ -f drivers/kernelsu/kernel_includes.h ] && sed -i 's|#include <linux/static_call.h>|/* disabled on 4.19 */|g' drivers/kernelsu/kernel_includes.h
          [ -f drivers/kernelsu/extension/cpu_spoof.c ] && sed -i 's/->vdso_clock_mode/->rating/g' drivers/kernelsu/extension/cpu_spoof.c
          if [ -f drivers/kernelsu/manager/pkg_observer.c ]; then
            sed -i '1i #ifndef CONFIG_KSU_SUSFS\n#define susfs_parse_priority_app_strings(...) (0)\n#endif' drivers/kernelsu/manager/pkg_observer.c
          fi
          find drivers/kernelsu -name "Kconfig*" -exec sed -i '/select KSU_SUSFS/d' {} +

          python3 - << 'PYEOF'
          import re, subprocess

          ksu_syms = subprocess.check_output(
              ["grep", "-rn", "ksu_", "drivers/kernelsu/"], text=True
          )

          def save_if_changed(path, old, new, label):
              if new != old:
                  with open(path, "w") as f:
                      f.write(new)
                  print(f"[OK] {path} gepatcht ({label})")
              else:
                  print(f"[WARN] Muster für {label} in {path} nicht gefunden!")

          # 1. kernel/reboot.c -> ksu_handle_sys_reboot
          with open("kernel/reboot.c", "r") as f:
              c = old = f.read()
          if "ksu_handle_sys_reboot" in ksu_syms:
              decl = "#ifdef CONFIG_KSU\nextern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n#endif\n\n"
              c = re.sub(r'(SYSCALL_DEFINE4\(reboot,)', decl + r'\1', c, count=1)
              c = re.sub(r'(SYSCALL_DEFINE4\(reboot,[^{]+\{[^\n]*\n(?:[ \t]+[^\n]*;[ \t]*\n)+)',
                         r'\1#ifdef CONFIG_KSU\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif\n', c, count=1)
              save_if_changed("kernel/reboot.c", old, c, "ksu_handle_sys_reboot")

          # 2. fs/exec.c -> ksu_handle_execveat
          with open("fs/exec.c", "r") as f:
              c = old = f.read()
          if "ksu_handle_execveat" in ksu_syms:
              has_hook_flag = "ksu_execveat_hook" in ksu_syms
              has_sucompat = "ksu_handle_execveat_sucompat" in ksu_syms
              decl = "#ifdef CONFIG_KSU\nstruct filename;\n"
              if has_hook_flag:
                  decl += "extern bool ksu_execveat_hook __read_mostly;\n"
              decl += "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n"
              if has_sucompat:
                  decl += "extern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n"
              decl += "#endif\n"
              c = re.sub(r'(#include\s*[<"][^>"]+[>"])', r'\1\n' + decl, c, count=1)
              if has_hook_flag and has_sucompat:
                  hook = "#ifdef CONFIG_KSU\n\tif (unlikely(ksu_execveat_hook))\n\t\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n\telse\n\t\tksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);\n#endif\n\t"
              else:
                  hook = "#ifdef CONFIG_KSU\n\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n#endif\n\t"
              c = re.sub(r'(if \(IS_ERR\(filename\)\))', hook + r'\1', c, count=1)
              save_if_changed("fs/exec.c", old, c, "ksu_handle_execveat")

          # 3. fs/open.c -> ksu_handle_faccessat
          with open("fs/open.c", "r") as f:
              c = old = f.read()
          if "ksu_handle_faccessat" in ksu_syms:
              decl = "#ifdef CONFIG_KSU\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n#endif\n\n"
              c = re.sub(r'(long do_faccessat\()', decl + r'\1', c, count=1)
              c = re.sub(r'(long do_faccessat\([^{]+\{[^\n]*\n(?:[ \t]+[^\n]*;[ \t]*\n)+)',
                         r'\1#ifdef CONFIG_KSU\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif\n', c, count=1)
              save_if_changed("fs/open.c", old, c, "ksu_handle_faccessat")

          # 4. fs/stat.c -> ksu_handle_stat + newfstat_ret + fstat64_ret (nach allen Includes!)
          with open("fs/stat.c", "r") as f:
              c = old = f.read()
          if "ksu_handle_stat" in ksu_syms:
              decl = "#ifdef CONFIG_KSU\nstruct stat;\nstruct stat64;\nextern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n"
              if "ksu_handle_newfstat_ret" in ksu_syms:
                  decl += "extern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);\n"
              if "ksu_handle_fstat64_ret" in ksu_syms:
                  decl += "extern void ksu_handle_fstat64_ret(unsigned long *fd, struct stat64 __user **statbuf_ptr);\n"
              decl += "#endif\n\n"

              # Deklarationen direkt vor vfs_statx platzieren (nach allen #include-Zeilen)
              c = re.sub(r'(int vfs_statx\()', decl + r'\1', c, count=1)

              # Hook in vfs_statx
              c = re.sub(r'(int vfs_statx\([^{]+\{[^\n]*\n(?:[ \t]+[^\n]*;[ \t]*\n)+)',
                         r'\1#ifdef CONFIG_KSU\n\tksu_handle_stat(&dfd, &filename, &flags);\n#endif\n', c, count=1)

              # Return-Hook gezielt in SYSCALL_DEFINE2(newfstat, ...) (wo vfs_fstat(fd, &stat) genutzt wird)
              if "ksu_handle_newfstat_ret" in ksu_syms:
                  c = re.sub(r'(vfs_fstat\(fd,\s*&stat\);\s*if\s*\(!error\)\s*error\s*=\s*cp_new_stat\(&stat,\s*statbuf\);)',
                             r'\1\n#ifdef CONFIG_KSU\n\tksu_handle_newfstat_ret(&fd, &statbuf);\n#endif', c, count=1)

              # Return-Hook gezielt in SYSCALL_DEFINE2(fstat64, ...) (wo vfs_fstat(fd, &stat) genutzt wird)
              if "ksu_handle_fstat64_ret" in ksu_syms:
                  c = re.sub(r'(vfs_fstat\(fd,\s*&stat\);\s*if\s*\(!error\)\s*error\s*=\s*cp_new_stat64\(&stat,\s*statbuf\);)',
                             r'\1\n#ifdef CONFIG_KSU\n\tksu_handle_fstat64_ret(&fd, &statbuf);\n#endif', c, count=1)

              save_if_changed("fs/stat.c", old, c, "ksu_handle_stat + newfstat_ret + fstat64_ret")

          # 5. fs/read_write.c -> ksu_handle_vfs_read
          with open("fs/read_write.c", "r") as f:
              c = old = f.read()
          if "ksu_handle_vfs_read" in ksu_syms:
              has_read_flag = "ksu_vfs_read_hook" in ksu_syms
              decl = "#ifdef CONFIG_KSU\n"
              if has_read_flag:
                  decl += "extern bool ksu_vfs_read_hook __read_mostly;\n"
              decl += "extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);\n#endif\n\n"
              c = re.sub(r'(ssize_t vfs_read\()', decl + r'\1', c, count=1)
              hook = "#ifdef CONFIG_KSU\n\tif (unlikely(ksu_vfs_read_hook))\n\t\tksu_handle_vfs_read(&file, &buf, &count, &pos);\n#endif\n" if has_read_flag else "#ifdef CONFIG_KSU\n\tksu_handle_vfs_read(&file, &buf, &count, &pos);\n#endif\n"
              c = re.sub(r'(ssize_t vfs_read\([^{]+\{[^\n]*\n(?:[ \t]+[^\n]*;[ \t]*\n)+)', r'\1' + hook, c, count=1)
              save_if_changed("fs/read_write.c", old, c, "ksu_handle_vfs_read")
          PYEOF

          DEFCONFIG=$(find arch/arm64/configs -name "redbull_defconfig" | head -n 1)
          printf '%s\n' \
            "CONFIG_KSU=y" \
            "CONFIG_KSU_MANUAL_HOOK=y" \
            "CONFIG_KSU_MULTI_MANAGER_SUPPORT=y" \
            "CONFIG_KALLSYMS=y" \
            "CONFIG_KALLSYMS_ALL=y" \
            "# CONFIG_KSU_SUSFS is not set" >> "$DEFCONFIG"

          git config user.email "builder@local"
          git config user.name "builder"
          git add -A
          git commit -m "Integrate BakaSU with manual hooks" || true

      - name: Compile Kernel (Image.lz4)
        run: |
          set -o pipefail
          cd work/kernel
          export PATH="$GITHUB_WORKSPACE/work/clang/bin:$PATH"
          DEFCONFIG=$(find arch/arm64/configs -name "redbull_defconfig" | head -n 1)
          DEFCONFIG_REL=${DEFCONFIG#arch/arm64/configs/}

          make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            "$DEFCONFIG_REL"

          ./scripts/config --file out/.config -e KSU -e KSU_MANUAL_HOOK -e KSU_MULTI_MANAGER_SUPPORT -d KSU_SUSFS
          for cfg in $(grep -h "^config " drivers/kernelsu/Kconfig drivers/kernelsu/*/Kconfig 2>/dev/null | awk '{print $2}' | grep -iE "SUSFS|SPOOF|KPM"); do
            ./scripts/config --file out/.config -d "$cfg"
          done
          make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

          echo "=== Aktive BakaSU-Konfiguration ==="
          grep -E "CONFIG_KSU" out/.config || true

          if ! make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" DTC_FLAGS="-f" Image.lz4 2>&1 | tee build.log; then
            echo "=== FEHLER IM BUILD-LOG ==="
            grep -iE "error:|ERROR \(|undefined reference|fatal error|No rule to make" build.log | tail -n 30
            exit 1
          fi

      - name: Package AnyKernel3
        run: |
          cd work
          for img in Image.lz4-dtb Image.lz4 Image.gz-dtb Image.gz Image; do
            if [ -f "kernel/out/arch/arm64/boot/$img" ]; then
              cp "kernel/out/arch/arm64/boot/$img" AnyKernel3/
              break
            fi
          done

          cd AnyKernel3
          sed -i 's/device.name1=maguro/device.name1=bramble/' anykernel.sh
          sed -i 's/device.name2=toro/device.name2=redfin/' anykernel.sh
          sed -i 's|BLOCK=.*;|BLOCK=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=0;/IS_SLOT_DEVICE=1;/' anykernel.sh
          zip -r9 "$GITHUB_WORKSPACE/BakaSU-bramble.zip" * -x .git README.md *placeholder

      - name: Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BakaSU-bramble
          path: BakaSU-bramble.zip
